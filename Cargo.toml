[workspace]
resolver = "2"
members = ["crates/manillen-core", "crates/manillen-cli", "crates/manillen-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", default-features = false, features = ["small_rng"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
